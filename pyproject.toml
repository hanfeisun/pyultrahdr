[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyultrahdr"
version = "0.1.0"
description = "Pure-Python SDR to Google Ultra HDR JPEG (gain map) converter, no libultrahdr needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hanfeisun" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "Pillow>=9.0",
]
keywords = ["hdr", "ultra-hdr", "gain-map", "jpeg", "iso-21496-1", "image"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/hanfeisun/pyultrahdr"
Issues = "https://github.com/hanfeisun/pyultrahdr/issues"

[project.scripts]
pyultrahdr = "sdr_to_hdr:main"

[tool.setuptools]
py-modules = ["sdr_to_hdr"]
